on:
  push:
    paths:
      - "zmk-config/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "zmk-config/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      build_matrix_path: zmk-config/build.yaml
      config_path: zmk-config/config
